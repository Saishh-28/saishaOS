<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saisha OS – Gym, Crystal Mountains</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Nunito:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffd98a}a:hover{color:#fff1c9}
@keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.gl{animation:glow 2.4s ease-in-out infinite}
.fa{animation:floatA 6s ease-in-out infinite}
input::placeholder{color:#a99fcc}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;font-family:'Nunito',sans-serif;color:#f6f0ff;background:linear-gradient(180deg,#0e1a3d 0%,#1d2a66 40%,#2b1f5e 100%)">

  <header style="padding:20px 20px 0;display:flex;align-items:center;gap:12px">
    <a href="Main.dc.html" aria-label="Back to the kingdom" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.16);color:#f6f0ff">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex:1;display:flex;flex-direction:column">
      <span style="font-size:13px;font-weight:700;color:#bff3f0;letter-spacing:.06em">WEDNESDAY · DAY B</span>
      <h1 style="margin:0;font-family:'Fraunces',serif;font-size:24px;font-weight:700">Deadlift day</h1>
    </div>
  </header>

  <section class="fa" style="margin:14px 20px 0;padding:14px 16px;border-radius:22px;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,0.08);border:1px solid rgba(191,243,240,0.28);box-shadow:0 12px 30px rgba(4,8,30,0.45), inset 0 1px 0 rgba(255,255,255,0.18)">
    <div style="position:relative;width:120px;height:86px" aria-hidden="true">
      <div style="position:absolute;left:0;bottom:0;width:120px;height:70px;clip-path:polygon(0 100%,30% 25%,48% 55%,66% 5%,100% 100%);background:linear-gradient(180deg,#9fb6ff,#3b4a8f)"></div>
      <sc-for list="{{crystals}}" as="c" hint-placeholder-count="7">
        <div class="{{c.cls}}" style="{{c.style}}"></div>
      </sc-for>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px">
      <span style="font-family:'Fraunces',serif;font-size:17px;font-weight:700">Strength · Level 1</span>
      <span style="font-size:13px;font-weight:700;color:#d9e6ff">3 of 7 crystals lit today</span>
      <div style="height:8px;border-radius:4px;background:rgba(4,8,30,0.55);overflow:hidden"><div style="width:70%;height:100%;border-radius:4px;background:linear-gradient(90deg,#8ee6e0,#bfd0ff);box-shadow:0 0 10px rgba(142,230,224,0.8)"></div></div>
      <span style="font-size:12px;font-weight:700;color:#cfdcf7">7 / 10 sessions toward Level 2</span>
    </div>
  </section>

  <div aria-label="This week" style="margin:12px 20px 0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px">
    <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
        <span style="font-size:11px;font-weight:800;color:#cfdcf7">{{d.day}}</span>
        <div style="{{d.style}}"></div>
      </div>
    </sc-for>
  </div>

  <div style="margin:12px 20px 0;padding:10px 12px;border-radius:14px;background:rgba(255,217,138,0.12);border:1px solid rgba(255,217,138,0.35);display:flex;gap:10px;align-items:flex-start">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffd98a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:0 0 auto;margin-top:2px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
    <span style="font-size:13px;font-weight:700;color:#fff1c9;line-height:1.35">Deadlift: hips back like closing a car door with your bum, flat back, weight close to your legs.</span>
  </div>

  <ul style="list-style:none;margin:10px 0 0;padding:0 20px;display:flex;flex-direction:column;gap:7px">
    <sc-for list="{{ex}}" as="e" hint-placeholder-count="7">
      <li style="{{e.card}}">
        <button aria-label="{{e.aria}}" style="{{e.orb}}">
          <sc-if value="{{e.done}}" hint-placeholder-val="{{false}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d2a66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
          </sc-if>
        </button>
        <div style="flex:1;display:flex;flex-direction:column;min-width:0">
          <span style="font-size:14px;font-weight:800;color:#fbf9ff">{{e.name}}</span>
          <span style="font-size:12px;font-weight:700;color:#cfdcf7">{{e.sets}} · last {{e.last}}</span>
        </div>
        <sc-if value="{{e.pb}}" hint-placeholder-val="{{false}}">
          <span style="font-size:11px;font-weight:800;padding:3px 7px;border-radius:10px;background:rgba(255,217,138,0.2);color:#ffe7b3">NEW BEST</span>
        </sc-if>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:#cfdcf7">
          <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Weight for {{e.name}}, kg</span>
          <input type="text" inputmode="decimal" value="{{e.kg}}" placeholder="–" style="width:44px;height:44px;box-sizing:border-box;border-radius:12px;border:1px solid rgba(255,255,255,0.22);background:rgba(4,8,30,0.45);color:#fbf9ff;text-align:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px">
          kg
        </label>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var raw = [
      { name: 'Deadlifts', sets: '3 × 8', last: '20 kg', kg: '22.5', done: true, pb: true },
      { name: 'Lat pulldown', sets: '3 × 10', last: '25 kg', kg: '25', done: true, pb: false },
      { name: 'Incline chest press', sets: '3 × 10', last: '6 kg', kg: '6', done: true, pb: false },
      { name: 'Reverse lunges', sets: '3 × 10 each', last: 'bodyweight', kg: '', done: false, pb: false },
      { name: 'Shoulder press', sets: '3 × 10', last: '5 kg', kg: '', done: false, pb: false },
      { name: 'Hammer curls + triceps', sets: '3 × 12 each', last: '5 kg', kg: '', done: false, pb: false },
      { name: 'Plank', sets: '3 × 30 s', last: '30 s', kg: '', done: false, pb: false }
    ];
    var ex = raw.map(function (e) {
      return Object.assign({}, e, {
        aria: (e.done ? 'Done: ' : 'Mark done: ') + e.name,
        card: 'display:flex;align-items:center;gap:10px;padding:5px 10px 5px 6px;border-radius:16px;background:' + (e.done ? 'rgba(142,230,224,0.08)' : 'rgba(255,255,255,0.08)') + ';border:1px solid ' + (e.done ? 'rgba(142,230,224,0.35)' : 'rgba(255,255,255,0.14)'),
        orb: 'flex:0 0 auto;width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;' + (e.done ? 'border:none;background:radial-gradient(circle at 40% 35%,#ffffff,#8ee6e0);box-shadow:0 0 14px rgba(142,230,224,0.85)' : 'border:2px solid rgba(191,243,240,0.5);background:rgba(4,8,30,0.4)')
      });
    });
    var spots = [[22, 40], [34, 26], [52, 46], [66, 14], [80, 36], [94, 52], [104, 62]];
    var crystals = spots.map(function (p, i) {
      var lit = i < 3;
      return { cls: lit ? 'gl' : '', style: 'position:absolute;left:' + p[0] + 'px;top:' + p[1] + 'px;width:8px;height:16px;clip-path:polygon(50% 0,100% 35%,50% 100%,0 35%);background:' + (lit ? '#c9fbff' : 'rgba(255,255,255,0.25)') + ';' + (lit ? 'filter:drop-shadow(0 0 6px #8ee6e0)' : '') };
    });
    var days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    var status = ['done', 'done', 'today', 'rest', 'plan', 'plan', 'rest'];
    var week = days.map(function (d, i) {
      var s = status[i];
      var st = 'width:100%;height:30px;border-radius:10px;';
      if (s === 'done') st += 'background:linear-gradient(180deg,#c9fbff,#8ee6e0);box-shadow:0 0 10px rgba(142,230,224,0.7)';
      else if (s === 'today') st += 'background:rgba(255,217,138,0.25);border:2px solid #ffd98a;box-sizing:border-box';
      else if (s === 'plan') st += 'background:rgba(255,255,255,0.12)';
      else st += 'background:rgba(255,255,255,0.05);border:1px dashed rgba(255,255,255,0.2);box-sizing:border-box';
      return { day: d, style: st };
    });
    return { ex: ex, crystals: crystals, week: week };
  }
}
</script>
</body>
</html>
