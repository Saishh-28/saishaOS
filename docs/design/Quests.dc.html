<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saisha OS – Today's quests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Nunito:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffd98a}a:hover{color:#fff1c9}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes floatA{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes up{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.tw{animation:twinkle 3s ease-in-out infinite}
.fa{animation:floatA 6s ease-in-out infinite}
.up{animation:up 1.6s ease-out infinite}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;font-family:'Nunito',sans-serif;color:#f6f0ff;background:linear-gradient(180deg,#120d36 0%,#24185a 55%,#3b2470 100%)">
  <sc-for list="{{stars}}" as="s" hint-placeholder-count="20">
    <div class="tw" style="{{s.style}}"></div>
  </sc-for>

  <header style="position:relative;padding:20px 20px 0;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:12px">
      <a href="Main.dc.html" aria-label="Back to the kingdom" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.16);color:#f6f0ff">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div style="flex:1;display:flex;flex-direction:column">
        <span style="font-size:13px;font-weight:700;color:#d9cff5;letter-spacing:.06em">FRIDAY 20 NOVEMBER</span>
        <h1 style="margin:0;font-family:'Fraunces',serif;font-size:26px;font-weight:700">Today's quests</h1>
      </div>
      <div class="fa" aria-hidden="true">
        <svg width="54" height="54" viewBox="0 0 100 100"><defs><radialGradient id="lq" cx="50%" cy="45%" r="55%"><stop offset="0%" stop-color="#fffbe9"/><stop offset="45%" stop-color="#ffe7a8"/><stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/></radialGradient></defs><circle cx="50" cy="50" r="48" fill="url(#lq)"/><path d="M50 18 C54 38 62 46 82 50 C62 54 54 62 50 82 C46 62 38 54 18 50 C38 46 46 38 50 18 Z" fill="#fff6d6"/><path d="M41 49 Q44 45 47 49" stroke="#3b2a6b" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M53 49 Q56 45 59 49" stroke="#3b2a6b" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M45 56 Q50 61 55 56" stroke="#3b2a6b" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </div>
    </div>

    <div role="tablist" aria-label="Quest blocks" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:5px;border-radius:22px;background:rgba(10,6,40,0.5);border:1px solid rgba(255,255,255,0.1)">
      <button role="tab" aria-selected="true" style="min-height:44px;border:none;border-radius:18px;background:linear-gradient(180deg,rgba(255,231,168,0.95),rgba(242,185,143,0.95));color:#2e2160;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px">Deep work · 9–1</button>
      <button role="tab" aria-selected="false" style="min-height:44px;border:none;border-radius:18px;background:transparent;color:#e3dafa;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px">Course prep · 2–3:30</button>
    </div>

    <div style="display:flex;align-items:center;gap:12px">
      <div style="flex:1;height:10px;border-radius:5px;background:rgba(10,6,40,0.55);overflow:hidden"><div style="width:40%;height:100%;border-radius:5px;background:linear-gradient(90deg,#8ee6e0,#ffd98a);box-shadow:0 0 10px rgba(142,230,224,0.7)"></div></div>
      <span style="font-size:13px;font-weight:800;color:#e3dafa">2 of 5 · +20 XP</span>
    </div>
  </header>

  <ul style="list-style:none;margin:16px 0 0;padding:0 20px;display:flex;flex-direction:column;gap:10px">
    <sc-for list="{{quests}}" as="q" hint-placeholder-count="5">
      <li style="{{q.card}}">
        <button aria-label="{{q.aria}}" style="{{q.orb}}">
          <sc-if value="{{q.done}}" hint-placeholder-val="{{false}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2e2160" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
          </sc-if>
        </button>
        <div style="flex:1;display:flex;flex-direction:column;gap:4px;min-width:0">
          <sc-if value="{{q.carried}}" hint-placeholder-val="{{false}}">
            <span style="align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.04em;color:#ffcfa8;padding:2px 8px;border-radius:10px;background:rgba(255,180,130,0.16)">FROM YESTERDAY</span>
          </sc-if>
          <span style="{{q.textStyle}}">{{q.text}}</span>
          <span style="font-size:12px;font-weight:700;color:#cfc3ef">{{q.island}}</span>
        </div>
        <div style="position:relative;display:flex;flex-direction:column;align-items:flex-end">
          <sc-if value="{{q.burst}}" hint-placeholder-val="{{false}}">
            <span class="up" style="position:absolute;top:-18px;right:0;font-size:13px;font-weight:800;color:#ffe7a8;text-shadow:0 0 8px rgba(255,217,138,0.9)">+10 XP</span>
          </sc-if>
          <span style="{{q.chip}}">+10</span>
        </div>
      </li>
    </sc-for>
  </ul>

  <div style="padding:12px 20px 0">
    <button style="width:100%;min-height:48px;border-radius:24px;border:1.5px dashed rgba(255,231,168,0.55);background:rgba(255,231,168,0.06);color:#ffe7b3;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Summon another quest
    </button>
  </div>

  <section aria-label="Boss battle" style="position:absolute;left:20px;right:20px;bottom:24px;padding:16px;border-radius:22px;background:linear-gradient(135deg,rgba(255,150,160,0.2),rgba(150,110,255,0.22));border:1px solid rgba(255,190,200,0.4);box-shadow:0 12px 30px rgba(8,4,30,0.45);display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:10px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffc4d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l6-6M14 4l6 6-8 8-6-6z"/><path d="M15 9l-2-2"/></svg>
      <div style="flex:1;display:flex;flex-direction:column">
        <span style="font-size:12px;font-weight:800;letter-spacing:.08em;color:#ffc4d8">BOSS BATTLE · MARKET SQUARE</span>
        <span style="font-family:'Fraunces',serif;font-size:17px;font-weight:700">The Silent Ledger: finish 10 CA interviews</span>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px">
      <sc-for list="{{boss}}" as="b" hint-placeholder-count="10">
        <div style="{{b.style}}"></div>
      </sc-for>
    </div>
    <span style="font-size:13px;font-weight:700;color:#efe6ff">3 of 10 defeated · reward: +300 XP and the Merchant's Seal badge</span>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var seed = 11;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    var stars = [];
    for (var i = 0; i < 26; i++) {
      stars.push({ style: 'position:absolute;left:' + Math.round(rnd() * 380) + 'px;top:' + Math.round(rnd() * 840) + 'px;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation-delay:' + (rnd() * 3).toFixed(2) + 's' });
    }
    var raw = [
      { text: 'Set scheduled power off 21:30 / on 6:55 and test it', island: 'Market Square · setup', done: true, carried: false, burst: false },
      { text: 'Make Spotify playlists: morning, gym, focus, sleep', island: 'Moonlit Garden · setup', done: true, carried: false, burst: true },
      { text: 'Build MacroDroid macros (morning, focus, evening)', island: 'Market Square · setup', done: false, carried: true, burst: false },
      { text: 'GST: watch ClearTax "GST Basics" videos', island: 'Market Square · learn GST', done: false, carried: false, burst: false },
      { text: 'GST: learn what a GSTIN is + registration basics', island: 'Market Square · learn GST', done: false, carried: false, burst: false }
    ];
    var quests = raw.map(function (q) {
      return Object.assign({}, q, {
        aria: (q.done ? 'Completed: ' : 'Mark done: ') + q.text,
        card: 'display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:' + (q.done ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.1)') + ';border:1px solid ' + (q.done ? 'rgba(142,230,224,0.35)' : 'rgba(255,255,255,0.16)') + ';box-shadow:' + (q.done ? 'none' : '0 8px 22px rgba(8,4,30,0.35), inset 0 1px 0 rgba(255,255,255,0.15)'),
        orb: 'flex:0 0 auto;width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;' + (q.done ? 'border:none;background:radial-gradient(circle at 40% 35%,#fffbe9,#8ee6e0);box-shadow:0 0 16px rgba(142,230,224,0.85)' : 'border:2px solid rgba(255,231,168,0.6);background:rgba(10,6,40,0.4)'),
        textStyle: 'font-size:15px;font-weight:700;line-height:1.3;' + (q.done ? 'color:#bdb2dc;text-decoration:line-through' : 'color:#fbf7ff'),
        chip: 'font-size:12px;font-weight:800;padding:4px 9px;border-radius:12px;' + (q.done ? 'background:rgba(142,230,224,0.18);color:#bff3f0' : 'background:rgba(255,217,138,0.15);color:#ffe7b3')
      });
    });
    var boss = [];
    for (var k = 0; k < 10; k++) {
      boss.push({ style: 'height:10px;border-radius:5px;' + (k < 3 ? 'background:linear-gradient(90deg,#ffc4d8,#ffd98a);box-shadow:0 0 8px rgba(255,196,216,0.8)' : 'background:rgba(255,255,255,0.15)') });
    }
    return { stars: stars, quests: quests, boss: boss };
  }
}
</script>
</body>
</html>
